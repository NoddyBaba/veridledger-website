name: 15-Minute Odds Sync

on:
  schedule:
    # Runs every 15 minutes (96 requests per day)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping The-Odds-API Sync
        run: curl -X GET "${{ secrets.VERCEL_PRODUCTION_URL }}/api/odds/sync?secret=${{ secrets.CRON_SECRET }}"
      
      - name: Ping API-Sports Sync
        run: curl -X GET "${{ secrets.VERCEL_PRODUCTION_URL }}/api/odds/football-sync?secret=${{ secrets.CRON_SECRET }}"
