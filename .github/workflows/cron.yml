name: 2-Hour Odds Sync

on:
  schedule:
    # Runs at minute 0 past every 2nd hour (e.g., 12:00, 2:00, 4:00)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Odds API
        run: |
          curl -X GET "${{ secrets.VERCEL_PRODUCTION_URL }}/api/odds/sync?secret=${{ secrets.CRON_SECRET }}"
